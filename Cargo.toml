[package]
name = "tg-ws-proxy"
version = "1.11.2"
edition = "2021"
license = "MIT"
description = "Telegram MTProto WebSocket bridge proxy"
default-run = "TgWsProxy"
build = "build.rs"

[lib]
name = "tg_ws_proxy"
path = "src/lib.rs"

[[bin]]
name = "TgWsProxy"
path = "src/bin/tray.rs"

[[bin]]
name = "tg-ws-proxy-cli"
path = "src/bin/cli.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
tokio-util = "0.7"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
rustls-native-certs = "0.8"
h2 = "0.4"
http = "1"
bytes = "1"
aes = "0.8"
ctr = "0.9"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fancy-regex = "0.14"
clap = { version = "4", features = ["derive"] }
socket2 = { version = "0.5", features = ["all"] }
log = { version = "0.4", features = ["std"] }
futures-util = "0.3"
thiserror = "2"
parking_lot = "0.12"
qrcode = { version = "0.14", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"
tao = "0.34"
slint = { version = "1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Security"] }
winreg = "0.55"
arboard = "3"
open = "5"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }

[build-dependencies]
slint-build = "1"
winresource = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
